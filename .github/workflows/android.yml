name: Build Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    permissions:
      contents: write
    concurrency:
      group: android-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - name: Restore persistent test signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.TRUCO_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing TRUCO_DEBUG_KEYSTORE_BASE64; refusing to change the APK signing key."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/truco-debug.p12"
          echo "TRUCO_DEBUG_KEYSTORE=$RUNNER_TEMP/truco-debug.p12" >> "$GITHUB_ENV"
      - name: Set increasing Android version
        shell: bash
        run: echo "TRUCO_VERSION_CODE=$((GITHUB_RUN_NUMBER + 1000))" >> "$GITHUB_ENV"
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/truco-debug.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: truco-android14-${{ github.event_name == 'pull_request' && 'pr-preview' || 'debug' }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish installable Android update
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/truco.apk"
          tag="android-$TRUCO_VERSION_CODE"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP/truco.apk" --clobber
          else
            gh release create "$tag" "$RUNNER_TEMP/truco.apk" --target "$GITHUB_SHA" --title "Truco Android · $TRUCO_VERSION_CODE" --notes "Actualización de Truco para Android 14 o superior. Descargá truco.apk y confirmá Actualizar para conservar tus partidas." --latest
          fi
