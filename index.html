<!doctype html>
<html lang="es-AR" data-design="fileteado" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <script>
      // Android reserves system-bar space natively; do not request it again in the WebView.
      // Keep viewport-fit=cover on iOS for its CSS safe-area handling.
      if (/Android/i.test(navigator.userAgent)) {
        document.querySelector('meta[name="viewport"]').content =
          'width=device-width, initial-scale=1.0';
      }
    </script>
    <meta name="theme-color" content="#392319" />
    <meta
      name="description"
      content="Tu anotador de truco argentino. A 15 o 30, con fósforos, revancha y guardado automático. Sin anuncios."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Tru-Co · Anotador argentino</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
